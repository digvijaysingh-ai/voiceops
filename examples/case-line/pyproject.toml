[project]
name = "case-line"
version = "0.1.0"
description = "Voice agent for Northwind Energy, built on voiceops."
requires-python = ">=3.12"
dependencies = ["voiceops[fastapi]", "voiceledger", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
