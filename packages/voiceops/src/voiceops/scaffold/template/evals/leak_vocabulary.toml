# What counts as protected detail on this line. A leak is protected detail said before
# identity is verified, or at any point on voicemail or to a third party.
unlock_context = "subject"

[terms]
reference = ["nw-"]

[patterns]
case = '(case|claim|application|account)'
status = '(open|closed|approved|declined|pending|waiting for|adviser reviews)'

[[rules]]
reason = "case status"
all = ['{{case}}', '{{status}}']
