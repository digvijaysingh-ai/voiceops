[project]
name = "voiceops"
version = "0.1.4"
description = "Deployment discipline for voice agents: safe defaults, a release gate, an audit ledger, deploy checks and call review."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Digvijay Singh" }]
requires-python = ">=3.12"
dependencies = ["voiceledger>=0.1.4", "pydantic>=2.7", "httpx>=0.27", "typer>=0.12", "python-dotenv>=1.0"]

[project.urls]
Repository = "https://github.com/digvijaysingh-ai/voiceops"
Documentation = "https://github.com/digvijaysingh-ai/voiceops/blob/main/docs/guide.md"

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
postgres = ["psycopg[binary]>=3.2", "voiceledger[postgres]"]

[project.scripts]
voiceops = "voiceops.cli:app"

[tool.uv.sources]
voiceledger = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
