[project]
name = "voiceledger"
version = "0.1.5"
description = "Hash-chained, signed event ledger with pluggable rules and a standalone verifier."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Digvijay Singh" }]
requires-python = ">=3.12"
dependencies = ["cryptography>=42"]

[project.urls]
Repository = "https://github.com/digvijaysingh-ai/voiceops"
Documentation = "https://github.com/digvijaysingh-ai/voiceops/blob/main/docs/guide.md"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
voiceledger = "voiceledger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
